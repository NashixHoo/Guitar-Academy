
name: Deploy Guitar Academy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Synchronize dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Setup Java JDK 17 for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run TypeScript validation
        run: npm run lint

      - name: Run integration tests
        run: npm test

      - name: Run security unit and HTTP backend tests
        run: npm run test:security

      - name: Run security tests with Firebase Emulator
        env:
          REQUIRE_FIREBASE_EMULATOR: 'true'
        run: npm run test:security:emulator

      - name: Build production for GitHub Pages
        env:
          BASE_URL: '/Guitar-Academy/'
        run: npm run build:gh-pages

      - name: Verify production output
        run: |
          test -f dist/index.html
          test -d dist/assets
          echo "Build output validated."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Publish GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy production
        id: deployment
        uses: actions/deploy-pages@v4
