name: Deploy Guitar Academy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  integration-tests:
    name: 1. Testes de Integração
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npm test

  typescript-lint:
    name: 2. TypeScript Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npm run lint

  http-auth-tests:
    name: 3. Testes HTTP e Autorização
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npm run test:security:unit

  firestore-emulator-tests:
    name: 4. Testes Firestore com Emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install -g firebase-tools
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - name: Run security tests with Firebase Emulator
        env:
          REQUIRE_FIREBASE_EMULATOR: 'true'
        run: npm run test:security:emulator

  production-build:
    name: 5. Build de Produção
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  gh-pages-build:
    name: 6. Build GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - name: Build production for GitHub Pages
        env:
          BASE_URL: '/Guitar-Academy/'
        run: npm run build:gh-pages
      - name: Verify production output
        run: |
          test -f dist/index.html
          test -d dist/assets
          echo "Build output validated."
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Publish GitHub Pages
    runs-on: ubuntu-latest
    needs:
      - integration-tests
      - typescript-lint
      - http-auth-tests
      - firestore-emulator-tests
      - production-build
      - gh-pages-build
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        always() &&
        needs.integration-tests.result == 'success' &&
        needs.typescript-lint.result == 'success' &&
        needs.http-auth-tests.result == 'success' &&
        needs.production-build.result == 'success' &&
        needs.gh-pages-build.result == 'success'
      }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy production
        id: deployment
        uses: actions/deploy-pages@v4
