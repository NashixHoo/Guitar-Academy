<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- Pestana superior reforçada do braço -->
  <line x1="5" y1="4" x2="19" y2="4" stroke-width="2.5"/>
  <!-- Contorno da escala / trastes da guitarra -->
  <rect x="5.5" y="4" width="13" height="16.5" rx="1.5"/>
  <!-- Trastes horizontais -->
  <line x1="5.5" y1="9.5" x2="18.5" y2="9.5"/>
  <line x1="5.5" y1="15" x2="18.5" y2="15"/>
  <!-- Cordas verticais intermediárias -->
  <line x1="9.8" y1="4" x2="9.8" y2="20.5"/>
  <line x1="14.2" y1="4" x2="14.2" y2="20.5"/>
  <!-- Pontos de digitação do acorde (digitação harmônica de referência) -->
  <circle cx="9.8" cy="12.2" r="1.5" fill="currentColor"/>
  <circle cx="14.2" cy="6.8" r="1.5" fill="currentColor"/>
  <circle cx="18.5" cy="17.8" r="1.5" fill="currentColor"/>
</svg>
