<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bgEvoluir" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A0B13" />
      <stop offset="45%" stop-color="#5E1420" />
      <stop offset="85%" stop-color="#7B1E2B" />
      <stop offset="100%" stop-color="#1E0509" />
    </linearGradient>

    <radialGradient id="stageGlowEvoluir" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#F5C542" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#B52A3A" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#1E0509" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#bgEvoluir)" />
  <rect width="1200" height="400" rx="24" fill="url(#stageGlowEvoluir)" />

  <!-- Trophy & Constellation Starfield Artwork on Right -->
  <g transform="translate(860, 200)" opacity="0.65">
    <!-- Starbursts -->
    <circle cx="90" cy="-60" r="4" fill="#F5C542" />
    <circle cx="-120" cy="80" r="3" fill="#FFFFFF" opacity="0.8" />
    <circle cx="-80" cy="-90" r="4.5" fill="#F5C542" />
    <circle cx="140" cy="50" r="3.5" fill="#F5C542" />

    <!-- Stylized Trophy -->
    <!-- Base -->
    <path d="M -50 90 L 50 90 L 35 110 L -35 110 Z" fill="#F5C542" />
    <rect x="-10" y="45" width="20" height="45" rx="3" fill="#E5B533" />
    <!-- Cup -->
    <path d="M -60 -60 
             C -60 20, -30 50, 0 50 
             C 30 50, 60 20, 60 -60 Z" 
          fill="#F5C542" />
    <!-- Handles -->
    <path d="M -60 -40 C -95 -40, -95 10, -50 15" fill="none" stroke="#F5C542" stroke-width="6" stroke-linecap="round" />
    <path d="M 60 -40 C 95 -40, 95 10, 50 15" fill="none" stroke="#F5C542" stroke-width="6" stroke-linecap="round" />
    <!-- Star on cup -->
    <polygon points="0,-25 5,-12 18,-12 8,-4 12,9 0,1 -12,9 -8,-4 -18,-12 -5,-12" fill="#7B1E2B" />
  </g>

  <!-- Left: Typography & Mastery Indicator -->
  <g transform="translate(60, 80)">
    <!-- Small Category Tag -->
    <rect x="0" y="0" width="130" height="28" rx="6" fill="rgba(245, 197, 66, 0.18)" stroke="#F5C542" stroke-width="1.2" />
    <text x="14" y="19" font-family="'Montserrat', sans-serif" font-weight="700" font-size="11" letter-spacing="2" fill="#F5C542">EVOLUIR</text>

    <!-- Headline -->
    <text x="0" y="78" font-family="'Montserrat', sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="1">Progresso &amp; Mentoria</text>
    <text x="0" y="118" font-family="'Montserrat', sans-serif" font-weight="900" font-size="34" fill="#F5C542" letter-spacing="0.5">21 Habilidades &amp; Professor IA</text>

    <!-- Subtitle -->
    <text x="0" y="160" font-family="'Montserrat', sans-serif" font-weight="500" font-size="16" fill="#E5D6D8" letter-spacing="0.3">Acompanhe seu tempo de prática diário, conquistas desbloqueadas e diagnósticos.</text>
  </g>
</svg>
